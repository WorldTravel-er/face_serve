[project]
name = "face-serve"
version = "0.1.0"
description = "RK3588 face recognition with RKNN detection/recognition and ONNX CPU alignment"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==1.26.4",
    "opencv-python==4.11.0.86",
    "onnxruntime",
    "pillow==11.3.0",
    "scikit-image==0.25.2",
    "lap==0.5.13",
    "fastapi==0.116.1",
    "pydantic>=2.10,<3",
    "uvicorn==0.35.0",
    "websockets==15.0.1"
]

[project.optional-dependencies]
rknn = ["rknn-toolkit-lite2==2.3.2; sys_platform == 'linux' and platform_machine == 'aarch64'"]
pytorch = ["torch>=2.1", "torchvision>=0.16"]
conversion = [
    "onnx==1.16.1",
    "rknn-toolkit2==2.3.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[dependency-groups]
dev = ["pytest==8.3.5", "httpx>=0.27,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
