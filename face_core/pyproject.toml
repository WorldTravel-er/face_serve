[project]
name = "face-core"
version = "0.1.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11, <=3.12"
dependencies = [
    "easydict==1.13",
    "einops==0.8.2",
    "fvcore==0.1.5.post20221221",
    "lap==0.5.13",
    "ninja==1.13.0",
    "omegaconf==2.3.1",
    "onnxruntime>=1.28.0",
    "scikit-image==0.25.2",
    "timm==1.0.27",
    "torch",
    "torchvision",
]

[project.scripts]
face-core = "face_core:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
